;
; flex_vision user_flow1 configuration: 5 x OmniVision OG05B10, MIPI 2-lane SDR + PWM sync
; Purpose: flex_vision integration test for isp_proton #172098 "sensor: bring up ov_og05b10".
; The topology matches sample_vin #173949 "Three OG05B10 Sync Slave" (SAMPLE_VIN_THREE_OG05B10=16)
; and stays consistent with it:
;   5 x OG05B10, 2592x1944 RAW10 RGGB, 2-lane, 960 Mbps/lane, linear 30fps
;   All are AX_SNS_SYNC_SLAVE(3), triggered uniformly by the SoC PWM (ax_vsync_ctrl.ko, PWM35)
;
; Hardware mapping (consistent with the sample_vin three-role setup):
;   sensor0 -> RX0 / Dev0 / Pipe0 / MCLK0
;   sensor1 -> RX1 / Dev1 / Pipe1 / MCLK0
;   sensor2 -> RX2 / Dev2 / Pipe2 / MCLK1
;   sensor3 -> RX3 / Dev3 / Pipe3 / MCLK1
;   sensor4 -> RX4 / Dev4 / Pipe4 / MCLK0
;
; Driver parameters come from msp/component/isp_proton/sensor/ov_og05b10:
;   object/lib : gSnsog05b10Obj / libsns_og05b10.so
;   enum       : only two linear register tables, no HDR profile
;       idx 1 : 2-lane 960M Master    2592x1944 10bit Linear 30fps
;       idx 2 : 2-lane 960M SyncSlave 2592x1944 10bit Linear 30fps
;   The driver og05b10_sensor_set_mode() selects the table automatically from eMasterSlaveSel (0 also works),
;   and this ini explicitly sets sdrSettingIndex=2, matching the SYNC_SLAVE setup of sync_mode=2.
;
; Note: the driver directory has no params_file/ax650/custom/*.bin and no aiisp_model,
;   so the tuning bin can only be null.bin (skips AX_ISP_LoadBinParams and uses the driver default
;   ISP params); bAiIspEnable must be 0. Replace it once tuning provides a bin.
;
; Multi-camera sync (sync_mode) follows the flex_vision definition:
;   2 = PWM mode: ax_vsync_ctrl.ko outputs PWM35 to drive all slave sensors
;   3 = GPIO mode: ax_ftc.ko emulates the sync pulse from CPU/TCM
; When sync_mode is non-zero, eMasterSlaveSel must be 3 in every [sensorN], otherwise parsing fails.
;
; The VIN data path (eDevMode/ePipeWorkMode/eFrameSrcType/bSkipDevBindMipi) is
; decided uniformly by media_cfg.c per profile: sync profile = OFFLINE + MODE0 + USER,
; and is not configured in [sensorN].
;
; Power-up preconditions (re-run on every power cycle, PWM mode):
;   ax_lookat 0x425023c -s 0x10003
;   ax_lookat 0x4250248 -s 0x10003
;   insmod /soc/ko/ax_vsync_ctrl.ko
; Some boards also need the pin muxed to PWM35:
;   ax_lookat 0x425083c -s 0x20003
;

;==============================================================================
; Global path configuration
;==============================================================================
[path]
tuning_bin_path = /opt/etc/          ; tuning bin directory (loading is skipped for null.bin)
sns_drv_path    = /soc/lib/          ; sensor driver .so directory (AX650 always uses /soc/lib)

;==============================================================================
; Business pipeline description
;==============================================================================
[ppl_des]
ppl_type = 0                         ; 0=video pipeline (VIN -> IVPS -> VENC)

;==============================================================================
; Sensor topology
;==============================================================================
[sensor_top]
sensor_num = 5
sync_mode  = 2                       ; 2=PWM (ax_vsync_ctrl.ko, PWM35)
sync_fps   = 30                      ; sync trigger rate, must match the 30fps sensor register set

;==============================================================================
; Sensor0 -- OG05B10 (dev0, rx0, MCLK0)
;==============================================================================
[sensor0]
enable                  = 1                      ; 0=temporarily disable this path (active indices are compacted)
sdrSensorTuningBinName  = AX650-OG05B10-auto.bin ; no custom bin -> driver default ISP params
hdrSensorTuningBinName  = null.bin               ; driver has no HDR profile; HDR unavailable
nSensorObjName          = gSnsog05b10Obj
nSensorLibName          = libsns_og05b10.so
; SDR register set index, from og05b10_settings.h:
;   2-lane SDR(SyncSlave): idx=2 (2592x1944 10bit Linear 30fps)
;   2-lane SDR(Master)   : idx=1 (2592x1944 10bit Linear 30fps)
;   current eLaneNum=2 eSnsMode=1(SDR) eMasterSlaveSel=3 -> idx=2
sdrSettingIndex         = 2
hdrSettingIndex         = 0                      ; no HDR profile
sdrDataRate             = 960                    ; Mbps/lane, must match sdrSettingIndex
hdrDataRate             = 960                    ; no HDR profile, placeholder value
eMasterSlaveSel         = 3                      ; 3=AX_SNS_SYNC_SLAVE
eRawType                = 10                     ; RAW10

nBusType                = 0                      ; 0=I2C
nDevNode                = -1                     ; -1=board default
nSnsClkIdx              = 0                      ; MCLK0
eSnsClkRate             = 24000000               ; 24MHz
nRxDev                  = 0
nDevId                  = 0
nPipeId                 = 0
eInputMode              = 0                      ; 0=MIPI CSI
ePhyMode                = 0                      ; 0=D-PHY
eLaneNum                = 2
nDataLaneMap0           = 0
nDataLaneMap1           = 1
nDataLaneMap2           = -1
nDataLaneMap3           = -1
nClkLane0               = 1
nClkLane1               = 0
nWidth                  = 2592
nHeight                 = 1944
eSnsMode                = 1                      ; 1=SDR/LINEAR
bAiIspEnable            = 0                      ; no aiisp_model, must be 0
bLdcEnable              = 0

