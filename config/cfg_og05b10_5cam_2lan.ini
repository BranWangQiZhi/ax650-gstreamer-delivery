;==============================================================================
; Multi-grid display (5-in-1 stitched stream: axstream5)
;
; SDK front_ppl: each of the N cameras occupies VENC[0..N-1] -> axstream0..N-1;
; the stitched canvas takes one extra VENC[N] -> axstreamN (axstream5 here).
; enable = 1 : adds one 960x720 tile tap per camera; the composer stitches a
;              3-column x 2-row, 2880x1440@30fps canvas (5 valid tiles, bottom
;              right tile empty), encoded by VENC[5] and served at
;              rtsp://<board-ip>:8554/axstream5.
; enable = 0 : no tile tap / canvas / grid encode channel; only axstream0..4.
;
; NOTE: com_cfg_parse.c only reads "enable" from this section. The other keys
;       below are kept for backward compatibility and are ignored; encoder
;       type, bitrate and stream_out_mode come from [Encode] and are shared by
;       all VENC channels (stream_out_mode defaults to 0 / RTSP when absent).
;==============================================================================
[multiGrideDisplay]
enable = 1                           ; 0=grid off, 1=grid on (axstream5)
stream_out_mode = 0 ; 0=RTSP, 1=UVC
nEncoderType    = 0 ; 0=H.264, 1=H.265, 2=MJPEG
enRcMode        = 1
u32Bitrate      = 4096
s32FixedQp      = 24

;==============================================================================
; Encoder profile (shared by AX650; channel count is derived from sensor_num)
;==============================================================================
[Encode]
nEncoderType    = 0                  ; 0=H264, 1=H265
enRcMode        = 1                  ; 1=CBR
u32Bitrate      = 2048               ; Kbps; shared by the main streams and VENC[5]

;==============================================================================
; IMU acquisition
;
; chip_type : 1=SCS3302 2=BMI088 3=ICM45686
; mode      : 0=chip default (ICM45686 always uses DRDY interrupt + bulk read) 1=irq 2=fifo
; dev_path  : empty = chip default node; ICM45686 defaults to /dev/ax_imu
; acc_odr
; gyr_odr   : -1 = keep driver default (200 Hz)
;             ODR codes: 0x3=6400Hz 0x4=3200 0x5=1600 0x6=800 0x7=400
;                          0x8=200 0x9=100 0xa=50 0xb=25 0xc=12.5
;                          0xd=6.25 0xe=3.125 0xf=1.5625
;             Note: on ICM45686 acc/gyr share the same DRDY source and must be equal;
;             when only one is set, this layer mirrors it to the other; setting both with different values is an error exit.
; ts_tick_hz: 0 = driver already outputs microseconds (fixed to 0 for ICM45686)
;
; Driver default ranges: acc +/-16 g, gyr +/-1000 dps; on startup the program reads
; back the actual range via GET_CONF and converts to g / dps, so a runtime SET_RANGE change is also displayed correctly.
;==============================================================================
[IMU]
enable       = 0
chip_type    = 3
mode         = 0
dev_path     = /dev/ax_imu
acc_odr      = -1
gyr_odr      = -1
ts_tick_hz   = 0

;==============================================================================
; Stereo depth (disabled by default; enable together with the two eye indices)
;==============================================================================
[StereoDepth]
enable          = 0
stream_out_mode = 0 ; 0=RTSP, 1=UVC
display         = 0
stereo_left     = 0
stereo_right    = 1
model_path      = /opt/bin/sample_multi_cam_uvc/models/axstereo_pro.axmodel
left_mesh       = /opt/data/npu_disp/mesh_left.txt
right_mesh      = /opt/data/npu_disp/mesh_right.txt
calib_width     = 1280
calib_height    = 720
out_width       = 640
out_height      = 384
fps             = 10
pts_tol_ms      = 100
enable_gdc      = 0
