<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>SRS Live - HTTP-FLV Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  html, body { margin:0; padding:0; height:100%; background:#111; color:#eee;
               font-family:-apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #bar { padding:10px 14px; background:#1b1b1b; border-bottom:1px solid #2c2c2c;
         display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:13px; }
  #bar b { color:#4fc3f7; font-weight:600; }
  #bar span.state { color:#9e9e9e; }
  #wrap { position:relative; height:calc(100% - 44px); display:flex;
          align-items:center; justify-content:center; background:#000; }
  video { max-width:100%; max-height:100%; width:auto; height:auto; background:#000; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center;
             justify-content:center; flex-direction:column; gap:14px;
             background:rgba(0,0,0,.72); cursor:pointer; }
  #overlay.hide { display:none; }
  #overlay .big { font-size:18px; }
  #overlay .sub { font-size:12px; color:#9e9e9e; }
  button { background:#2196f3; color:#fff; border:0; border-radius:6px;
           padding:10px 22px; font-size:15px; cursor:pointer; }
  button:hover { background:#1976d2; }
</style>
</head>
<body>
<div id="bar">
  <span>流：<b id="name">-</b></span>
  <span>协议：HTTP-FLV (TCP)</span>
  <span class="state" id="state">待播放</span>
  <span class="state" id="stats"></span>
</div>
<div id="wrap">
  <video id="v" muted playsinline autoplay controls></video>
  <div id="overlay">
    <div class="big">点击开始播放</div>
    <div class="sub">HTTP-FLV over TCP · 延迟约 1 秒</div>
    <button id="btn">开始播放</button>
  </div>
</div>
<script src="js/mpegts.min.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var stream = qs.get('stream') || 'live1';
  var host = location.hostname;
  var port = location.port || '8080';
  var url = 'http://' + host + ':' + port + '/live/' + stream + '.flv';
  var v = document.getElementById('v');
  var stateEl = document.getElementById('state');
  var statsEl = document.getElementById('stats');
  var overlay = document.getElementById('overlay');
  document.getElementById('name').textContent = stream;
  document.title = 'Live: ' + stream;

  if (!mpegts.getFeatureList().mseLivePlayback) {
    stateEl.textContent = '当前浏览器不支持 MSE';
    return;
  }
  var player = mpegts.createPlayer({
    type: 'flv', isLive: true, url: url,
    cors: true, hasAudio: false, hasVideo: true
  }, {
    enableWorker: true,
    enableStashBuffer: true,
    stashInitialSize: 256,
    liveBufferLatencyChasing: true,
    liveBufferLatencyMaxLatency: 4.0,
    liveBufferLatencyMinRemain: 1.0,
    lazyLoad: false,
    autoCleanupSourceBuffer: true,
    autoCleanupMaxBackwardDuration: 8,
    autoCleanupMinBackwardDuration: 4
  });
  player.attachMediaElement(v);
  player.load();

  player.on(mpegts.Events.ERROR, function (t, d) {
    stateEl.textContent = '错误: ' + t + ' ' + d;
  });
  v.addEventListener('playing', function () {
    stateEl.textContent = '播放中';
    overlay.classList.add('hide');
  });
  v.addEventListener('waiting', function () { stateEl.textContent = '缓冲中...'; });
  v.addEventListener('error', function () { stateEl.textContent = '视频错误'; });

  function start() {
    stateEl.textContent = '连接中...';
    player.play().catch(function (e) {
      stateEl.textContent = '播放被拦截: ' + e;
    });
  }
  document.getElementById('btn').addEventListener('click', function (e) {
    e.stopPropagation(); start();
  });
  overlay.addEventListener('click', start);

  setInterval(function () {
    try {
      var b = player.buffered.length ? player.buffered.end(0) - v.currentTime : 0;
      var kb = player.statisticsInfo ? Math.round(player.statisticsInfo.speed / 1024) : 0;
      statsEl.textContent = b.toFixed(1) + 's 缓冲 · ' + kb + ' KB/s';
    } catch (e) {}
  }, 1000);
})();
</script>
</body>
</html>
